schema_version: 1
system:
  key: quartel_digital
  name: "Quartel Digital — Learner Runtime Operacional"
  repository: "gadelhajulio-crypto/quartel-digital-site"
  branch: "mobile/main"
ownership:
  owns_facts:
    - product_local_learner_identity
    - learner_auth_link
    - learner_force_assignment
    - product_onboarding_state
    - product_billing_state
    - product_entitlement_access_projection
    - learner_progress
    - academic_attempts_results
    - xp_gamification
    - ranking_and_streak
    - learner_communication_state
    - product_local_events
  owns_decisions:
    - learner_runtime_access_enforcement
    - product_local_academic_progression_rules
  does_not_own:
    - rp_wide_customer_identity
    - consolidated_rp_lifecycle
    - commercial_eligibility
    - next_best_action
    - ecosystem_send_authorization
    - universal_commercial_consent
    - canonical_curriculum_authoring
sensitive_internal:
  - detailed_academic_results
  - individual_quiz_and_simulado_answers
  - detailed_lesson_progress
  - xp_event_ledger
  - chat_messages_and_summaries
  - ai_threads
  - raw_gateway_payloads
  - technical_provider_identifiers
publishes:
  - key: admin_sanitized_aggregate_views
    status: implemented
    mode: read_only
    notes:
      - "Current administrative views are sanitized/service-role-only and do not form a person-level Customer 360 contract."
  - key: product_relationship_facts
    status: candidate_not_contracted
  - key: sanitized_engagement_telemetry
    status: candidate_use_case_gated
consumes: []
integration:
  rp_os:
    mode: candidate_read_contracts_only
    contracts: []
    notes:
      - "RP OS may consume approved minimized relationship/access projections without acquiring learner-runtime write authority."
  rp_growth_intelligence:
    mode: candidate_sanitized_telemetry_only
    contracts: []
    notes:
      - "Growth may interpret approved sanitized facts/telemetry but does not own learner operational truth."
lifecycle:
  target_audience: "recruits already incorporated"
  confirmed_incorporation_fact: "not_implemented_or_not_evidenced"
  designated_to_serve_is_not_incorporated: true
consent:
  commercial_consent_authority: unresolved
  whatsapp_commercial_send_authorization: unresolved
  push_permission_is_not_commercial_consent: true
curriculum:
  curriculum_authoring_owner: rp_os
  runtime_projection_owner: quartel_digital
  publication_contract: draft_not_activated
  consumer_foundation: implemented_in_repo_not_activated
  consumer_location: "supabase/functions/_shared/qd-curriculum-publication-v1"
  source_mapping: schema_defined_not_populated
  staging_migration: authored_not_applied
  shadow_ingestion_core: implemented_in_repo_not_activated
  shadow_staging_adapter: implemented_in_repo_not_activated
  atomic_release_staging_rpc: authored_not_applied
  receiver_endpoint: implemented_in_repo_disabled_not_activated
  receiver_config: disabled_by_default
  transport: proposed_https_post_hmac_not_accepted
  transport_auth: proposed_adr_007_not_accepted
  transport_nonce_migration: authored_not_applied
  receiver_secret_provisioning: not_done
  producer_signing: not_implemented
  runtime_sync: not_implemented
  activation: not_implemented
  notes:
    - "RP OS owns canonical curriculum authoring, editorial governance, provenance/approval and curriculum versioning."
    - "Quartel Digital maintains local runtime projections for learner delivery without becoming curriculum source of truth."
    - "Gate 5A adds only a server-side conformance mirror plus explicit source-to-local mapping and append-only staging schema foundation."
    - "Gate 5B adds only a server-side shadow-ingestion core and injected staging adapter; it exposes no network endpoint."
    - "Release and release-membership staging is designed as one atomic service-role-only RPC."
    - "Gate 5A/5B migrations are repository-only and have not been applied to a remote database."
    - "Gate 5C adds a disabled-by-default HTTP shadow receiver with proposed HMAC-SHA256 transport authentication and atomic nonce anti-replay."
    - "The receiver is not activated: Supabase function config is disabled, runtime enable flag is absent by default, no integration secret is provisioned, and producer signing is not implemented."
    - "ADR-007 for transport/auth remains proposed_not_accepted in the Architecture Registry; Gate 5C code is reviewable implementation evidence, not accepted runtime authorization."
    - "No automatic sync, release activation or learner-visible publication is implemented."
    - "Source mapping preserves existing QD local UUIDs; title/name heuristics are forbidden."
    - "Publication must preserve local learner-state references and must not destructively replace identifiers referenced by progress, attempts, responses, XP or historical review."
commerce:
  purchase_and_entitlement_are_distinct: true
  refund_dispute_propagation: not_fully_evidenced
change_control:
  architecture_registry: "gadelhajulio-crypto/rp-ecosystem-architecture"
  breaking_change_requires_registry_update: true
notes:
  - "This manifest applies to the operational learner runtime on branch mobile/main, not to the institutional site on main."
  - "Product-local learner identity must not be promoted to canonical RP identity."
  - "Detailed academic/communication data stays product-local by default."
